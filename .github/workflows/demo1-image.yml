name: Demo1_Ride image

# Builds the WebXR demo into a container and publishes it to GitHub
# Container Registry. Pull it with:
#   docker pull ghcr.io/<owner>/<repo>/demo1-ride:latest

on:
  push:
    branches: [main]
    paths:
      - 'Demo1_Ride/**'
      - '.github/workflows/demo1-image.yml'
    tags: ['v*']
  pull_request:
    paths:
      - 'Demo1_Ride/**'
      - '.github/workflows/demo1-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: demo1-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase in a repository path, and GitHub usernames
      # are frequently not lowercase.
      - name: Resolve image name
        id: img
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/demo1-ride" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Midway — a carnival ride in WebXR
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./Demo1_Ride
          file: ./Demo1_Ride/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # buildx layer cache, so a source-only change skips npm ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Demo1_Ride image published"
            echo
            echo '```'
            echo "docker pull ${{ steps.img.outputs.name }}:latest"
            echo '```'
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
