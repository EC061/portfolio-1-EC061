name: Demo1_Ride pages

# Optional second home for the demo: a GitHub Pages deployment, which
# gives a public HTTPS URL without needing a host of your own. It only
# runs when the repository variable ENABLE_PAGES is set to "true"
# (Settings -> Secrets and variables -> Actions -> Variables), so the
# workflow stays quiet until Pages is actually turned on.

on:
  push:
    branches: [main]
    paths:
      - 'Demo1_Ride/**'
      - '!Demo1_Ride/**.md'
      - '!Demo1_Ride/Study/**'
      - '.github/workflows/demo1-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Demo1_Ride
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Demo1_Ride/package-lock.json

      - run: npm ci --no-audit --no-fund

      # Pages serves the repo at /<repo>/, and the demo lives one level
      # deeper, so the bundle has to know its own base path.
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/Demo1_Ride/
        run: npm run build

      - name: Lay out the site
        run: |
          mkdir -p ../_site/Demo1_Ride
          cp -r dist/* ../_site/Demo1_Ride/
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=./Demo1_Ride/">\n' > ../_site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
