server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # This app is served behind an external reverse proxy that terminates
    # TLS, so trust its forwarded headers rather than inventing our own.
    absolute_redirect off;
    server_tokens off;

    # The container runs with a read-only root filesystem (see
    # docker-compose.yml), so nginx's scratch space lives on a tmpfs.
    client_body_temp_path /tmp/nginx-client-body;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/wasm;

    # WebXR needs a secure context (the proxy's job) and an explicit
    # permissions grant for spatial tracking.
    add_header Permissions-Policy "xr-spatial-tracking=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames, so these can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Permissions-Policy "xr-spatial-tracking=(self)" always;
        try_files $uri =404;
    }

    # The entry document must not be cached, or a deploy is invisible
    # until the browser decides otherwise.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Permissions-Policy "xr-spatial-tracking=(self)" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
